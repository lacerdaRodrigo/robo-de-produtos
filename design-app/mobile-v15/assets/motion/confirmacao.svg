<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title"><title id="title">Confirmação animada</title><style>@keyframes circle{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}@keyframes check{to{stroke-dashoffset:0}}circle{transform-origin:center;animation:circle .3s ease-out both}path{stroke-dasharray:80;stroke-dashoffset:80;animation:check .45s .15s ease-out forwards}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-delay:0ms!important}}</style><circle cx="80" cy="80" r="58" fill="#e1eee5"/><path d="m53 80 18 18 37-39" fill="none" stroke="#236347" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
