<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 720" role="img" aria-labelledby="title"><title id="title">Abertura animada Radar</title><style>@keyframes reveal{from{opacity:0;transform:translate(141px,238px) rotate(-22deg) scale(.7)}to{opacity:1;transform:translate(141px,238px) rotate(0) scale(1)}}@keyframes pulse{from{opacity:.4;transform:scale(.65)}to{opacity:0;transform:scale(1.5)}}@keyframes word{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}.mark{animation:reveal .75s cubic-bezier(.2,.8,.2,1) both;transform-origin:54px 54px}.ring{transform-box:fill-box;transform-origin:center;animation:pulse .9s .4s ease-out both}.word{animation:word .65s .3s both}.sub{animation:word .65s .43s both}.progress{transform-origin:157px 570px;animation:progress 1.6s ease-out both}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-delay:0ms!important}.ring{display:none}}</style><path fill="#f6f4f0" d="M0 0h390v720H0z"/><circle class="ring" cx="195" cy="292" r="72" fill="none" stroke="#b6421e"/><g class="mark"><g transform="scale(1.6875)"><path fill="#bf4822" fill-rule="evenodd" d="M9 17a8 8 0 0 1 8-8h19a8 8 0 0 1 5.66 2.34L57 26.68a7.5 7.5 0 0 1 0 10.6L37.28 57a7.5 7.5 0 0 1-10.6 0L11.34 41.66A8 8 0 0 1 9 36V17Zm14 1a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/><path stroke="#bf4822" stroke-width="4" stroke-linecap="round" d="m47 8 4-4m4 12 5-1M38 5l1-3"/></g></g><text class="word" x="195" y="403" text-anchor="middle" fill="#282629" font-family="sans-serif" font-size="42" font-weight="800" letter-spacing="-2">radar.</text><text class="sub" x="195" y="432" text-anchor="middle" fill="#70675f" font-family="sans-serif" font-size="13">Boas escolhas à vista.</text><rect x="157" y="570" width="76" height="3" rx="1.5" fill="#e5dfd7"/><rect class="progress" x="157" y="570" width="76" height="3" rx="1.5" fill="#b6421e"/></svg>
