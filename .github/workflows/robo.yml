name: robo-livelo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coleta-livelo-manual
  cancel-in-progress: false

jobs:
  solicitar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend/robo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/robo/pyproject.toml
      - name: Instalar dependências do despachante
        run: python -m pip install --no-cache-dir .
      - name: Enfileirar coleta Livelo no Samsung
        env:
          DATABASE_URL: ${{ secrets.ROBO_DISPATCH_DATABASE_URL }}
        run: >-
          python -m robo_celular.fila solicitar
          --fonte livelo
          --github-run-id "${{ github.run_id }}"
