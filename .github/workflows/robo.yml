name: robo

on:
  schedule:
    # 12h/17h/23h UTC = 09h/14h/20h de Brasilia (UTC-3, fixo o ano todo).
    # C02: o cron do Actions nao garante horario exato, atraso e normal.
    - cron: "0 12,17,23 * * *"
  workflow_dispatch:
    inputs:
      enviar_email:
        description: "Enviar e-mail desta execucao (o botao do site desmarca)"
        type: boolean
        default: true

# PRD 9.4: o robo nunca escreve no repositorio.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e .

      # RNF06: qualquer falha sai com codigo diferente de zero e o GitHub
      # notifica sozinho. E o que distingue "sem promocao" de "robo quebrado".
      - name: Verificar promocoes
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SENHA_APP_GMAIL: ${{ secrets.SENHA_APP_GMAIL }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          # Ausente enquanto o secret nao existir: nesse caso o catalogo vem
          # do TOML, que continua versionado. Presente, o banco manda e o
          # arquivo vira reserva (PRD V2 7.1.1).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIMIAR_PARCEIROS: "150"
          # Vazio no agendado (schedule nao preenche `inputs`): o robo trata
          # ausencia como "true". So o disparo manual do site manda "false".
          ENVIAR_EMAIL: ${{ inputs.enviar_email }}
        run: python -m robo_livelo.principal
