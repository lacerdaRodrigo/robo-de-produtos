name: app-robo

on:
  push:
  pull_request:
  workflow_dispatch:

# Mesma regra dos demais workflows: o token nao precisa de escrita.
permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Mantem o ambiente mobile reproduzivel entre execucoes.
          flutter-version: "3.44.1"
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formatacao
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analise
        run: flutter analyze

      - name: Testes unitarios e widgets mobile
        shell: bash
        run: |
          find test -type f -name '*_test.dart' \
            ! -name 'app_smoke_test.dart' \
            ! -name 'controlador_painel_livelo_test.dart' \
            ! -name 'pagina_painel_livelo_test.dart' \
            -print0 |
            xargs -0 flutter test --exclude-tags 'golden || web'

      - name: Gerar APK debug para aceite manual
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --debug --dart-define=ATIVAR_APP_CHECK=false

      - name: Disponibilizar APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: robo-produtos-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
