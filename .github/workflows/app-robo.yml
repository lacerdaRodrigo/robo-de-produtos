name: app-robo

on:
  push:
    paths:
      - "app/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      distribuir:
        description: "Enviar a APK para o Drive privado e notificar por e-mail"
        required: false
        default: false
        type: boolean

# Mesma regra dos demais workflows: o token nao precisa de escrita.
permissions:
  contents: read

concurrency:
  group: app-robo-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Mantem o ambiente mobile reproduzivel entre execucoes.
          flutter-version: "3.44.1"
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formatacao
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analise
        run: flutter analyze

      - name: Testes unitarios e widgets mobile
        shell: bash
        run: |
          find test -type f -name '*_test.dart' \
            ! -name 'app_smoke_test.dart' \
            ! -name 'controlador_painel_livelo_test.dart' \
            ! -name 'pagina_painel_livelo_test.dart' \
            -print0 |
            xargs -0 flutter test

  distribuir_apk:
    name: Distribuir APK privada
    needs: flutter
    if: >-
      vars.ANDROID_RELEASE_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]') ||
      (github.event_name == 'workflow_dispatch' && inputs.distribuir == true))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      - name: Dependencias Flutter
        working-directory: app
        run: flutter pub get

      - name: Gerar APK release assinada
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 ausente}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD ausente}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS ausente}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD ausente}"
          keystore="$RUNNER_TEMP/radar-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          trap 'rm -f "$keystore"' EXIT
          export ANDROID_KEYSTORE_PATH="$keystore"
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          flutter build apk --release \
            --build-number="$build_number" \
            --dart-define=API_URL=https://robo-de-produtos.vercel.app \
            --dart-define=ATIVAR_APP_CHECK=false
          mkdir -p "$RUNNER_TEMP/radar-apk"
          short_sha="${GITHUB_SHA:0:8}"
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          apk_name="robo-app-release-${app_version}-${GITHUB_RUN_ID}-${short_sha}.apk"
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$sdk_root" && -d "$sdk_root/build-tools" ]]
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          [[ -x "$apksigner" ]]
          "$apksigner" verify --print-certs "$apk_path"
          cp "$apk_path" "$RUNNER_TEMP/radar-apk/$apk_name"
          {
            echo "APK_PATH=$RUNNER_TEMP/radar-apk/$apk_name"
            echo "APK_NAME=$apk_name"
            echo "APP_VERSION=$app_version+$build_number"
          } >> "$GITHUB_ENV"

      - name: Instalar cliente Google
        run: python3 -m pip install --disable-pip-version-check --no-input \
          google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Publicar no Drive privado e enviar aviso
        env:
          GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SENHA_APP_GMAIL: ${{ secrets.SENHA_APP_GMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/distribuir_apk_drive.py distribute \
            --apk "$APK_PATH" \
            --file-name "$APK_NAME" \
            --run-key "$GITHUB_RUN_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --sha "$GITHUB_SHA" \
            --version "$APP_VERSION"
