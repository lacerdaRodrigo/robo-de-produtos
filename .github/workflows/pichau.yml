name: pichau-pc-gamer

on:
  schedule:
    # 09h, 14h e 20h em America/Sao_Paulo (UTC-3 sem horario de verao),
    # alinhado aos workflows Livelo e Inter.
    - cron: "0 12,17,23 * * *"
  workflow_dispatch:

concurrency:
  group: pichau-pc-gamer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar_android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/robo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Instalar dependencias da fila
        run: python -m pip install --no-cache-dir .
      - name: Enfileirar coleta no Android
        id: enfileirar
        env:
          DATABASE_URL: ${{ secrets.PICHAU_DISPATCH_DATABASE_URL }}
        run: |
          python -m robo_pichau.fila_android enqueue \
            --chave "github-${{ github.run_id }}" \
            --origem "${{ github.event_name }}" \
            --github-run-id "${{ github.run_id }}" > "$RUNNER_TEMP/pichau-android-job-id"
          job_id="$(tr -d '[:space:]' < "$RUNNER_TEMP/pichau-android-job-id")"
          [[ "$job_id" =~ ^[0-9]+$ ]] || { echo "id de fila invalido" >&2; exit 1; }
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "Solicitacao Pichau Android enfileirada: id=$job_id"
      - name: Aguardar publicação no Android
        env:
          DATABASE_URL: ${{ secrets.PICHAU_DISPATCH_DATABASE_URL }}
        run: |
          python -m robo_pichau.fila_android wait \
            --id "${{ steps.enfileirar.outputs.job_id }}" \
            --timeout-seconds 1200 \
            --poll-seconds 30
