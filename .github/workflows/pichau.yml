name: pichau-pc-gamer

on:
  schedule:
    # 09h, 15h e 21h em America/Sao_Paulo (UTC-3 sem horario de verao).
    # Os intervalos entre execuções são de pelo menos seis horas.
    - cron: "0 0,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: pichau-pc-gamer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar robo
        run: python -m pip install --no-cache-dir "./backend/robo[pichau]"
      - name: Coletar e publicar Pichau
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m robo_pichau.principal
