name: shopping-inter

on:
  schedule:
    # 12h/17h/23h UTC = 09h/14h/20h de Brasilia (UTC-3).
    - cron: "0 12,17,23 * * *"
  workflow_dispatch:

# Cashback e Compre direto formam uma unica rodada do Banco Inter. Uma nova
# rodada espera a anterior terminar e qualquer falha deixa o workflow inteiro
# vermelho; snapshots validos anteriores continuam preservados no banco.
concurrency:
  group: shopping-inter
  cancel-in-progress: false

# Os coletores nunca escrevem no repositorio.
permissions:
  contents: read

jobs:
  cashback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/robo

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/robo/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e .

      - name: Atualizar cashback do Shopping Inter
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Piso defensivo, nao quantidade fixa: 110, 112, 130 etc. sao aceitos.
          LIMIAR_LOJAS_INTER: "100"
        run: python -m robo_livelo.principal_inter

  preparar_produtos:
    needs: cashback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/robo
    outputs:
      execucao_id: ${{ steps.preparar.outputs.execucao_id }}
      lojas: ${{ steps.preparar.outputs.lojas }}
      tem_lojas: ${{ steps.preparar.outputs.tem_lojas }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/robo/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e .

      - name: Sincronizar vendedores e preparar matriz
        id: preparar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m robo_livelo.principal_produtos_inter preparar >> "$GITHUB_OUTPUT"

  coletar_produtos:
    needs: preparar_produtos
    if: needs.preparar_produtos.outputs.tem_lojas == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/robo
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        loja: ${{ fromJSON(needs.preparar_produtos.outputs.lojas) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/robo/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e .

      - name: Coletar loja selecionada
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python -m robo_livelo.principal_produtos_inter coletar
          --execucao-id "${{ needs.preparar_produtos.outputs.execucao_id }}"
          --loja-id "${{ matrix.loja }}"

  concluir_produtos:
    needs: [cashback, preparar_produtos, coletar_produtos]
    if: >-
      always() &&
      needs.cashback.result == 'success' &&
      needs.preparar_produtos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/robo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/robo/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e .

      - name: Consolidar resultado da rodada
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python -m robo_livelo.principal_produtos_inter concluir
          --execucao-id "${{ needs.preparar_produtos.outputs.execucao_id }}"
