name: formatar-categorias-inter

on:
  push:
    branches:
      - feat/categorias-inter-fonte-oficial

permissions:
  contents: write

jobs:
  formatar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/categorias-inter-fonte-oficial
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Formatar Dart
        working-directory: app
        run: dart format lib test
      - name: Commitar somente formatacao
        run: |
          if git diff --quiet -- app/lib app/test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib app/test
          git commit -m "style(app): formatar categorias do Inter"
          git push origin HEAD:feat/categorias-inter-fonte-oficial
