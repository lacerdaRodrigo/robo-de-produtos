name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

# PRD 9.4: o token nao precisa de escrita. Sem esta linha, uma dependencia
# comprometida poderia commitar no repositorio.
permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/robo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/robo/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatacao (ruff)
        run: ruff format --check .

      # PRD 8.4: minimo de 90% no nucleo puro.
      - name: Testes e cobertura
        run: pytest --cov --cov-fail-under=90

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

      - name: Tipos
        run: npm run checar

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run testar

      - name: Build
        run: npm run build
