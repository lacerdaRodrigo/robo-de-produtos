name: diagnostico-payload-v2

# Workflow temporario, disparado no push desta propria branch (o Actions so
# aceita workflow_dispatch para arquivos ja presentes na branch default, e
# esta branch nao e a default). Nao faz parte do robo de producao
# (robo.yml nao muda). Existe para inspecionar, uma unica vez, a estrutura
# real do payload JSON embutido na pagina de parceiros da Livelo, antes de
# reescrever o extrator para a V2.0 (RF14 do docs/PRD-V2.md).
#
# Mesma politica de identificacao honesta do adaptador de producao
# (RNF02): 1 unica requisicao GET, User-Agent identificado, sem autenticar
# na Livelo e sem tecnica de evasao.
#
# Apagar este arquivo depois que a fixture do payload for capturada.

on:
  push:
    branches: [claude/documentacao-v2-u7v8wf]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Baixar pagina e inspecionar payload
        run: |
          cat > /tmp/diagnostico.py <<'PY'
          import json
          import re
          import requests

          URL = "https://www.livelo.com.br/juntar-pontos/todos-os-parceiros"
          UA = "robo-livelo/1.0 (projeto pessoal; github.com/rodrigo/robo-livelo)"

          resposta = requests.get(
              URL, timeout=30, headers={"User-Agent": UA, "Accept-Language": "pt-BR"}
          )
          resposta.raise_for_status()
          html = resposta.text
          print(f"=== HTML baixado: {len(html)} caracteres ===")

          with open("/tmp/pagina.html", "w", encoding="utf-8") as f:
              f.write(html)

          print()
          print("=== Tags <script> com id ou type=json (id, type, tamanho) ===")
          for m in re.finditer(r"<script\b([^>]*)>", html):
              attrs = m.group(1)
              id_m = re.search(r'id="([^"]*)"', attrs)
              type_m = re.search(r'type="([^"]*)"', attrs)
              if not id_m and not (type_m and "json" in type_m.group(1)):
                  continue
              inicio = m.end()
              fim = html.find("</script>", inicio)
              tamanho = (fim - inicio) if fim != -1 else -1
              print(
                  f"  id={(id_m.group(1) if id_m else None)!r} "
                  f"type={(type_m.group(1) if type_m else None)!r} tamanho={tamanho}"
              )

          print()
          print("=== Ocorrencias dos campos esperados (RF14) ===")
          for termo in [
              "parityBau",
              "parityClub",
              '"parity"',
              "dateStart",
              "dateEnd",
              "activeCampaign",
              "promotion",
          ]:
              pos = html.find(termo)
              if pos == -1:
                  print(f"--- {termo!r}: NAO encontrado ---")
                  continue
              print(f"--- {termo!r}: encontrado em offset {pos} ---")
              janela = html[max(0, pos - 300) : pos + 800]
              print(janela)
              print()

          print("=== Tentativa de parse do __NEXT_DATA__ (se existir) ===")
          m = re.search(
              r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',
              html,
              re.DOTALL,
          )
          if not m:
              print("Nao ha script __NEXT_DATA__ nesta pagina.")
          else:
              dados = json.loads(m.group(1))
              chaves = list(dados.keys()) if isinstance(dados, dict) else type(dados)
              print("Chaves de nivel superior:", chaves)

              def procurar_parceiro(obj, caminho=""):
                  if isinstance(obj, dict):
                      if "parityBau" in obj or "dateEnd" in obj:
                          return obj, caminho
                      for k, v in obj.items():
                          achado = procurar_parceiro(v, f"{caminho}.{k}")
                          if achado:
                              return achado
                  elif isinstance(obj, list):
                      for i, v in enumerate(obj):
                          achado = procurar_parceiro(v, f"{caminho}[{i}]")
                          if achado:
                              return achado
                  return None

              achado = procurar_parceiro(dados)
              if not achado:
                  print("Nenhum objeto com parityBau/dateEnd dentro do __NEXT_DATA__.")
              else:
                  parceiro, caminho = achado
                  print(f"Exemplo de parceiro encontrado em: {caminho}")
                  print(json.dumps(parceiro, indent=2, ensure_ascii=False))
          PY
          python /tmp/diagnostico.py

      - name: Publicar HTML bruto como artefato
        uses: actions/upload-artifact@v4
        with:
          name: pagina-livelo-bruta
          path: /tmp/pagina.html
          retention-days: 7
