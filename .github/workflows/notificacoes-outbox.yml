name: notificacoes-outbox

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notificacoes-outbox
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Processar outbox na API Production
        env:
          API_URL: https://robo-de-produtos.vercel.app
          OUTBOX_CRON_SECRET: ${{ secrets.OUTBOX_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          resposta="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --connect-timeout 10 \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${OUTBOX_CRON_SECRET}" \
            --header "Accept: application/json" \
            "${API_URL}/api/cron/notificacoes/outbox")"

          processadas="$(jq --exit-status --raw-output '.processadas | numbers' <<<"${resposta}")"
          enviadas="$(jq --exit-status --raw-output '.enviadas | numbers' <<<"${resposta}")"
          recuperadas="$(jq --exit-status --raw-output '.recuperadas | numbers' <<<"${resposta}")"
          echo "Outbox processada: processadas=${processadas} enviadas=${enviadas} recuperadas=${recuperadas}"
