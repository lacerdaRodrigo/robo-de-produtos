name: regerar-goldens

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regerar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Regenerar goldens (mesmo runtime do CI)
        run: >-
          flutter test --update-goldens
          test/app/autenticacao/pagina_entrar_test.dart
          test/app/paginas/inicio_test.dart
          test/app/navegacao/moldura_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: goldens-regenerados
          path: app/test/goldens/